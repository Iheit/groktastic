name: Build Groktastic

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: ubuntu-24.04
            preset: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -G "MinGW Makefiles" -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-narrowing"

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Package Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target package_windows

      - name: Package Linux
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --target package_linux

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: groktastic-${{ matrix.preset }}-x64
          path: build/package/
