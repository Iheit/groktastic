name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Package Linux build
        run: |
          mkdir -p dist
          cp build/groktastic dist/groktastic
          if [ -d assets ]; then cp -r assets dist/assets; fi
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: groktastic-linux-x64
          path: dist/
